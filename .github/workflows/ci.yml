name: CI

on:
  push:
    branches: [main, develop, "fix/**", "feat/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Без лимита зависший раннер держит job до шести часов.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Application imports
        run: python -c "import app.main"

      - name: Single Alembic head
        run: |
          HEADS=$(alembic heads 2>&1)
          echo "$HEADS"
          [ "$(echo "$HEADS" | grep -c '(head)')" -eq 1 ]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Layer contracts
        run: python scripts/check_layer_contracts.py app

      - name: Layer imports
        run: python scripts/check_layer_imports.py app

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports

      - name: Run unit tests with coverage
        run: |
          pytest -m "not integration" tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=70

  check-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     syncscribe
          POSTGRES_PASSWORD: syncscribe
          POSTGRES_DB:       syncscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_HOST=postgres/POSTGRES_HOST=localhost/' .env
          sed -i 's#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@postgres:5432/syncscribe#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@localhost:5432/syncscribe#' .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check single Alembic head
        run: |
          HEADS=$(alembic heads 2>&1)
          echo "$HEADS"
          HEAD_COUNT=$(echo "$HEADS" | grep -c '(head)' || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head, found $HEAD_COUNT"
            echo "$HEADS"
            exit 1
          fi
          echo "OK: single head confirmed"

      - name: Apply migrations from scratch (fresh DB)
        run: alembic upgrade head

      - name: Schema matches ORM models
        run: alembic check

      - name: Verify alembic current == head
        run: |
          CURRENT=$(alembic current 2>&1)
          echo "$CURRENT"
          if ! echo "$CURRENT" | grep -q '(head)'; then
            echo "ERROR: alembic current is not at head"
            exit 1
          fi

      - name: Downgrade to base and re-upgrade (round-trip)
        run: |
          alembic downgrade base
          alembic upgrade head
          CURRENT=$(alembic current 2>&1)
          if ! echo "$CURRENT" | grep -q '(head)'; then
            echo "ERROR: round-trip upgrade failed"
            exit 1
          fi
          echo "OK: round-trip migration confirmed"

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-test, check-migrations]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     syncscribe
          POSTGRES_PASSWORD: syncscribe
          POSTGRES_DB:       syncscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_ACCESS_KEY=syncscribe-app -e S3_SECRET_KEY=change-me-s3-app-secret \
            -e S3_BUCKET=syncscribe-documents \
            -v "$PWD/docker/seaweedfs-start.sh:/usr/local/bin/seaweedfs-start.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.48 /usr/local/bin/seaweedfs-start.sh
          for i in $(seq 1 30); do
            curl -sf http://localhost:8333/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8333/healthz || { docker logs seaweedfs; exit 1; }

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_HOST=postgres/POSTGRES_HOST=localhost/' .env
          sed -i 's#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@postgres:5432/syncscribe#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@localhost:5432/syncscribe#' .env
          sed -i 's#REDIS_URL=redis://redis:6379/0#REDIS_URL=redis://localhost:6379/0#' .env
          sed -i 's#RATE_LIMIT_STORAGE_URI=redis://redis:6379/1#RATE_LIMIT_STORAGE_URI=redis://localhost:6379/1#' .env
          sed -i 's/S3_ENDPOINT=seaweedfs:8333/S3_ENDPOINT=localhost:8333/' .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      # Порог покрытия проверяется в lint-and-test на unit-тестах. Здесь покрытие только в отчёте:
      # 15 сквозных сценариев не затрагивают LLM и воркер, и любой рост этого кода ронял бы джобу
      # без какой-либо связи с качеством интеграционных тестов.
      - name: Run integration tests with coverage report
        run: |
          pytest -m integration tests/integration -v \
            --cov=app \
            --cov-report=term-missing

  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t syncscribe-backend:ci .

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t syncscribe-worker:ci .
