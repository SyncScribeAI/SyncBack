# Базовая конфигурация: инфраструктура (Postgres, Redis, SeaweedFS) доступна
# только внутри сети compose, пароли берутся из .env без значений по умолчанию.
# Для локальной разработки с доступом к портам с хоста:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

networks:
  syncscribe-net:
    driver: bridge

volumes:
  postgres-data:
  seaweedfs-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncscribe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-syncscribe}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncscribe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syncscribe-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syncscribe-net

  # S3-совместимое хранилище. Один процесс (weed mini): master, volume, filer и
  # S3-шлюз на 8333. Бакет и единственный пользователь с правами только на него
  # создаются при старте из S3_* в .env (см. docker/seaweedfs-start.sh).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Задайте S3_ACCESS_KEY в .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Задайте S3_SECRET_KEY в .env}
      S3_BUCKET: ${S3_BUCKET:-syncscribe-documents}
    entrypoint: ["/bin/sh", "/usr/local/bin/seaweedfs-start.sh"]
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs-start.sh:/usr/local/bin/seaweedfs-start.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syncscribe-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # Корневые сертификаты для LLM_CA_BUNDLE (например, Минцифры для GigaChat).
      - ./certs:/srv/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - syncscribe-net

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./certs:/srv/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - syncscribe-net

  # Анализ по контракту ML 2.0 (ANALYSIS_PROVIDER ≠ legacy_llm). Процессов столько, сколько
  # одновременных прогонов выдерживает ML-конвейер: остальные документы ждут в очереди брокера,
  # а не получают 429. При нескольких репликах в сумме — не больше слотов конвейера.
  worker-analysis:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - ${ANALYSIS_V2_QUEUE:-analysis_v2}
      - --concurrency=${ANALYSIS_V2_CONCURRENCY:-1}
      - -n
      - analysis@%h
    volumes:
      - ./certs:/srv/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - syncscribe-net
