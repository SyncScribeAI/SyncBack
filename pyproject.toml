[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "syncscribe"
version = "0.1.0"
description = "SyncScribe backend — документация всегда актуальна"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "asyncpg>=0.29",
    "redis>=5.0",
    "minio>=7.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "markdown-it-py==4.3.0",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "fakeredis>=2.23",
    "aiosqlite>=0.20",
    "anyio>=4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: тесты, которым нужны реальные Postgres/Redis/S3-хранилище (SeaweedFS)",
    "perf: бюджеты сложности и памяти; идут в обычном прогоне, отдельный маркер — для выборочного запуска",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PLC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["ALL"]
"tests/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Header",
]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy asyncio выполняет ORM-код в greenlet; без этой настройки трассировка
# теряется после первого обращения к БД и покрытие async-кода занижается.
concurrency = ["thread", "greenlet"]
